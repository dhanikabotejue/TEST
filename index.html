<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled HTML Page</title>
    
    <!--
      CSS Block: Applies global styling adjustments.
      Intent: Change the default text color to dark blue.
    -->
    <style>
        /*
         * Target the body element to set the default foreground color
         * for all textual content within the page.
         * 'DarkBlue' is an accessible, well-defined color name corresponding to #00008B.
         */
        body {
            color: DarkBlue;
            font-family: Arial, sans-serif;
            margin: 20px; /* Add slight margin for better readability */
        }
    </style>
</head>
<body>
    <!-- Main content area -->
    <h1>Welcome to the Page</h1>
    <p>This paragraph demonstrates the dark blue text color applied via the internal style sheet in the head section.</p>
    
    <footer>
        <p>This footer text is also rendered in dark blue.</p>
    </footer>
</body>
</html>
