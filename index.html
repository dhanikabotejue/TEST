<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Text Example</title>

    <!-- 
    CSS styles defined here to ensure the text is orange. 
    Targeting the 'body' element applies the orange color 
    to all default text elements within the page.
    -->
    <style>
        body {
            /* Set the default text color to orange */
            color: orange;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
    </style>
</head>
<body>
    <!-- Main content container -->
    <h1>Welcome to the Page</h1>
    <p>This paragraph contains text that is rendered in orange, as defined by the CSS rules in the header.</p>
</body>
</html>
