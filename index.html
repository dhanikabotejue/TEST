<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page with Black Background</title>
    
    <!-- 
    Internal styles block. 
    Sets the background color of the body element to black for the entire page.
    Also sets the default text color to white for readability contrast.
    -->
    <style>
        body {
            /* Sets the background color to pure black */
            background-color: black;
            /* Sets the default text color to white for contrast against the black background */
            color: white;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- Content starts here -->
    <h1>Hello World</h1>
    <p>The background of this document has been modified to black, ensuring high contrast for the text.</p>
</body>
</html>
